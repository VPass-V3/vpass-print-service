# nfpm (https://nfpm.goreleaser.com) packaging for the .deb. Build:
#   VERSION=1.0.0 nfpm package -p deb -f installers/linux/nfpm.yaml -t artifacts/
name: vpass-print-service
arch: amd64
platform: linux
version: ${VERSION}
section: misc
priority: optional
maintainer: VPass <support@vpass.io>
description: Prints VPass visitor badges on the connected label printer via CUPS.
vendor: VPass
homepage: https://www.vpass.io
license: Proprietary
depends:
  - cups-client
contents:
  - src: ./artifacts/linux-x64/vpass-print
    dst: /usr/local/vpass-print-service/vpass-print
    file_info:
      mode: 0755
  - src: /usr/local/vpass-print-service/vpass-print
    dst: /usr/local/bin/vpass-print
    type: symlink
scripts:
  postinstall: ./installers/linux/postinstall.sh
  preremove: ./installers/linux/preremove.sh
