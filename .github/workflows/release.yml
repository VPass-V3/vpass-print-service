name: release

# Tag a commit v1.2.3 to publish installers. Asset names must match
# server_organisation/Helper/PrintServiceReleases.cs (and the adminapp pairing dialog):
#   vpass-print-service-<ver>-win-x64-setup.exe
#   vpass-print-service-<ver>-osx-arm64.pkg / -osx-x64.pkg
#   vpass-print-service_<ver>_amd64.deb
#   vpass-print-service-<ver>-linux-x64.tar.gz
# Then set PRINT_SERVICE_LATEST_VERSION=<ver> in k8s/*/config/env_config.yaml so devices and the
# adminapp show "update available".

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet test --configuration Release

  build:
    needs: test
    strategy:
      matrix:
        include:
          - { rid: win-x64,   os: windows-latest }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64,   os: macos-latest }
          - { rid: linux-x64, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Publish
        shell: bash
        run: |
          dotnet publish src/VPass.PrintService/VPass.PrintService.csproj -c Release -r ${{ matrix.rid }} \
            --self-contained true -p:PublishSingleFile=true -p:Version=${VERSION:-1.0.0} -o artifacts/${{ matrix.rid }}

      - name: Windows installer (Inno Setup)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" "/DPublishDir=..\..\artifacts\win-x64" installers\windows\vpass-print-service.iss
      - name: macOS pkg
        if: startsWith(matrix.rid, 'osx')
        run: installers/macos/build-pkg.sh "$VERSION" "${{ matrix.rid }}" "artifacts/${{ matrix.rid }}" artifacts
      - name: Linux deb + tarball
        if: matrix.rid == 'linux-x64'
        run: |
          curl -sSL https://github.com/goreleaser/nfpm/releases/download/v2.41.0/nfpm_2.41.0_Linux_x86_64.tar.gz | tar -xz nfpm
          VERSION="$VERSION" ./nfpm package -p deb -f installers/linux/nfpm.yaml -t artifacts/
          tar -czf "artifacts/vpass-print-service-$VERSION-linux-x64.tar.gz" -C artifacts/linux-x64 vpass-print

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: |
            artifacts/*.exe
            artifacts/*.pkg
            artifacts/*.deb
            artifacts/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
